services:
  postgres:
    image: postgres:15-alpine
    container_name: be_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1
      POSTGRES_DB: be_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: be_nestjs
    command: pnpm run start:dev
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-1}@postgres:5432/${DB_NAME:-be_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-key-change-this}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      PORT: 3000
      NODE_ENV: development
      BCRYPT_SALT_ROUNDS: "10"
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  postgres_data:
